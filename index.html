<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Libros Offline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Gestor de Libros Offline</h1>

  <ul id="book-list"></ul>

  <script src="app.js"></script>
</body>
</html>
